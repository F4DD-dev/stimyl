<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Стимул — класс</title>
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3efe6;
      --ink: #1d1a16;
      --muted: #6d655c;
      --card: #fffdf8;
      --line: #e4dccf;
      --mastered: #1f6b45;
      --practice: #8a5a12;
      --repeat: #8d2f2f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main { max-width: 960px; margin: 0 auto; padding: 28px 20px 48px; }
    h1 { font-size: 28px; font-weight: 650; margin: 0 0 4px; }
    p { color: var(--muted); line-height: 1.45; }
    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px;
      margin-top: 16px;
    }
    h2 { font-size: 16px; margin: 0 0 10px; }
    ul { margin: 0; padding-left: 18px; }
    li { margin: 6px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .status { font-weight: 650; }
    .status[data-status="mastered"] { color: var(--mastered); }
    .status[data-status="needs_practice"] { color: var(--practice); }
    .status[data-status="repeat"] { color: var(--repeat); }
    .message { padding: 12px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Стимул</h1>
    <p id="lead">Кабинет класса</p>
    <div id="content" class="message">Открываю карту класса…</div>
  </main>
  <script>
    const labels = {
      mastered: "усвоено",
      needs_practice: "нужна практика",
      repeat: "повторить"
    };

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function cell(topic) {
      if (!topic.status) return "нет попыток";
      const percent = topic.correct_percent == null ? "" : `, ${topic.correct_percent}%`;
      return `<span class="status" data-status="${topic.status}">${labels[topic.status] || topic.status}${percent}</span>`;
    }

    function render(data) {
      const topics = data.topics.map((topic) => `<th>${esc(topic.title)}</th>`).join("");
      const rows = data.students.map((student) => {
        const cells = student.topics.map((topic) => `<td>${cell(topic)}</td>`).join("");
        return `<tr><th>${esc(student.display_name)}</th>${cells}</tr>`;
      }).join("");
      const priorities = (data.priorities || []).map((item) => `<li>${esc(item)}</li>`).join("");
      const stalled = (data.stalled || []).map((item) => `<li>${esc(item)}</li>`).join("");
      document.querySelector("#lead").textContent = `Класс ${data.class_title}`;
      document.querySelector("#content").outerHTML = `
        <section>
          <h2>Кому помочь</h2>
          ${priorities ? `<ul>${priorities}</ul>` : "<p>Пока нет учеников со статусом «повторить».</p>"}
          ${data.frequent_mistakes ? `<p>${esc(data.frequent_mistakes)}</p>` : ""}
        </section>
        <section>
          <h2>Где прогресс остановился</h2>
          ${stalled ? `<ul>${stalled}</ul>` : "<p>За последнюю неделю никто не застрял.</p>"}
        </section>
        <section>
          <h2>Карта тем</h2>
          <table>
            <thead><tr><th>Ученик</th>${topics}</tr></thead>
            <tbody>${rows || "<tr><td>В классе пока нет учеников.</td></tr>"}</tbody>
          </table>
        </section>`;
    }

    async function main() {
      if (window.WebApp && window.WebApp.ready) window.WebApp.ready();
      const params = new URLSearchParams(location.hash.slice(1));
      const initData = (window.WebApp && window.WebApp.initData) || params.get("initData") || "";
      if (initData) {
        const login = await fetch("/api/session", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          credentials: "same-origin",
          body: JSON.stringify({init_data: initData})
        });
        if (!login.ok) {
          document.querySelector("#content").textContent = "Не удалось войти. Откройте кабинет из MAX.";
          return;
        }
      }
      const response = await fetch("/api/teacher/class", {credentials: "same-origin"});
      if (response.status === 401 || response.status === 403) {
        document.querySelector("#content").textContent = "Откройте кабинет из чата MAX под учётной записью учителя.";
        return;
      }
      if (!response.ok) {
        document.querySelector("#content").textContent = "Карта класса сейчас недоступна.";
        return;
      }
      render(await response.json());
    }

    main();
  </script>
</body>
</html>
