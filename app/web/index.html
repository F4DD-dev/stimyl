<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6fc">
  <title>Стимул</title>
  <style>html,body{margin:0;background:var(--bg,#f8f6fc);color:var(--text,#20202a)}</style>
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("stimul_theme") || "auto";
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/assets/styles.css?v=16">
</head>
<body data-entry="auto" data-bot="">
  <div id="app"></div>
  <div id="toast" class="toast" hidden role="status"></div>
  <dialog id="dialog" class="sheet"></dialog>
  <noscript><p class="noscript">Нужен JavaScript, чтобы открыть Стимул.</p></noscript>
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <script type="module" src="/assets/js/app.js?v=27"></script>
</body>
</html>
