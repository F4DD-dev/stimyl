name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stimul
          POSTGRES_PASSWORD: stimul
          POSTGRES_DB: stimul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stimul -d stimul"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - name: migrations on empty postgres
        env:
          DATABASE_URL: postgresql+asyncpg://stimul:stimul@localhost:5432/stimul
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://stimul:stimul@localhost:5432/stimul
          DATABASE_URL: postgresql+asyncpg://stimul:stimul@localhost:5432/stimul
        run: pytest
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --format json --output audit.json
          python scripts/fail_on_high_vulns.py audit.json
