services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stimul
      POSTGRES_PASSWORD: stimul
      POSTGRES_DB: stimul
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stimul -d stimul"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: always

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://stimul:stimul@db:5432/stimul
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: always
